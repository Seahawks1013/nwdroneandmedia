# Ready for the move to Netlify: builds at the domain root (no BASE_PATH needed).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers (CSP, X-Frame-Options, HSTS, etc.) and asset caching are written
# to dist/_headers at build time from src/security.mjs, so they live in one place.
# Netlify serves every site over HTTPS and redirects HTTP automatically once the
# domain's certificate is issued; the Strict-Transport-Security header then tells
# browsers to always use HTTPS.
