# Weekly pull requests for npm and GitHub Actions updates, including security fixes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
